name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-panggung.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-panggung
  NEXT_PUBLIC_FIREBASE_APP_ID: demo-app
  NEXT_PUBLIC_USE_EMULATOR: "1"
  TICKET_QR_SECRET: ci-secret-panggung

jobs:
  check:
    name: Lint, type-check, unit test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright + Firebase Emulator)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e:ci
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
